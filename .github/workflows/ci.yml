name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Java tests / Flyway / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Unit and Testcontainers integration
        working-directory: backend
        run: mvn -B -ntp verify
  web:
    name: Next.js lint / types / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Temporary lockfile export for reviewed reproducibility
        working-directory: apps/web
        run: |
          echo 'SCS_LOCKFILE_BASE64_BEGIN'
          base64 --wrap=600 package-lock.json
          echo 'SCS_LOCKFILE_BASE64_END'
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Production build
        working-directory: apps/web
        run: npm run build

  smoke:
    name: Clean-start Docker Compose / API / web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated development environment
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-not-for-production/' .env
          docker compose config -q
      - name: Build and start all three services
        run: docker compose up --build --detach
      - name: Verify migration, API and frontend communication
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/system/status > /tmp/scs-status.json; then
              break
            fi
            sleep 3
          done
          grep -q '"database":"connected"' /tmp/scs-status.json
          curl --fail --silent http://127.0.0.1:8080/v3/api-docs | grep -q '"openapi"'
          denied_code=$(curl --silent --output /tmp/scs-denied.json --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/ops/orders)
          test "$denied_code" = "401" -o "$denied_code" = "403"
          grep -q '"error"' /tmp/scs-denied.json
          curl --fail --silent http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000 > /tmp/scs-web.html; then
              break
            fi
            sleep 3
          done
          grep -q 'API dan database terhubung' /tmp/scs-web.html
      - name: Diagnose services if smoke test fails
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Remove isolated CI containers and data
        if: always()
        run: docker compose down --volumes --remove-orphans
