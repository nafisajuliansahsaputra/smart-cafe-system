name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-baseline:
    name: Security baseline / tracked secrets / production npm advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prove scanner catches synthetic credentials and insecure browser storage
        run: node --test scripts/security-preflight.test.mjs
      - name: Reject high-confidence exposed secrets in the tracked tree
        run: node scripts/security-preflight.mjs
      - name: Audit production JavaScript dependencies via npm advisory database
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high --no-fund

  backend:
    name: Java tests / Flyway / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Unit and Testcontainers integration
        working-directory: backend
        run: mvn -B -ntp verify
  web:
    name: Next.js lint / types / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Production build
        working-directory: apps/web
        run: npm run build

  smoke:
    name: Clean-start Docker Compose / API / web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated development environment
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-not-for-production/' .env
          sed -i 's/^SCS_JOIN_THROTTLE_SECRET=.*/SCS_JOIN_THROTTLE_SECRET=only-for-ci-runs-this-is-not-a-production-key/' .env
          docker compose config -q
      - name: Build and start all three services
        run: docker compose up --build --detach
      - name: Verify migration, API and frontend communication
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/system/status > /tmp/scs-status.json; then
              break
            fi
            sleep 3
          done
          grep -q '"database":"connected"' /tmp/scs-status.json
          curl --fail --silent http://127.0.0.1:8080/v3/api-docs | grep -q '"openapi"'
          denied_code=$(curl --silent --output /tmp/scs-denied.json --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/ops/orders)
          test "$denied_code" = "401" -o "$denied_code" = "403"
          grep -q '"error"' /tmp/scs-denied.json
          curl --fail --silent http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000 > /tmp/scs-web.html; then
              break
            fi
            sleep 3
          done
          grep -q 'API dan database terhubung' /tmp/scs-web.html
          login_code=$(curl --silent --output /tmp/scs-login.html --write-out '%{http_code}' http://127.0.0.1:3000/staff/login)
          test "$login_code" = "200"
          grep -q 'Masuk sebagai staf' /tmp/scs-login.html
          staff_code=$(curl --silent --output /tmp/scs-staff-guest.html --write-out '%{http_code}' http://127.0.0.1:3000/staff/orders)
          test "$staff_code" = "307"
          ! grep -q 'Order Control Center</h1>' /tmp/scs-staff-guest.html
          for path in /staff/kitchen /staff/waiter /staff/tables; do
            code=$(curl --silent --output /tmp/scs-protected.html --write-out '%{http_code}' "http://127.0.0.1:3000$path")
            test "$code" = "307"
          done
          tables_code=$(curl --silent --output /tmp/scs-tables.json --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/waiter/tables)
          test "$tables_code" = "401" -o "$tables_code" = "403"
          waiter_code=$(curl --silent --output /tmp/scs-waiter.json --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/waiter/orders/tasks)
          test "$waiter_code" = "401" -o "$waiter_code" = "403"
          curl --fail --silent http://127.0.0.1:3000/visit > /tmp/scs-guest.html
          grep -q 'Belum bergabung ke meja' /tmp/scs-guest.html
          for path in /visit/cart /visit/orders; do
            code=$(curl --silent --output /tmp/scs-guest-protected.html --write-out '%{http_code}' "http://127.0.0.1:3000$path")
            test "$code" = "307"
          done
          curl --fail --silent http://127.0.0.1:3000/t/unknown-demo-table > /tmp/scs-unknown-table.html
          grep -q 'Meja tidak ditemukan' /tmp/scs-unknown-table.html
          receipt_code=$(curl --silent --output /tmp/scs-denied-receipt.json --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/me/orders/00000000-0000-0000-0000-000000000000/receipt)
          test "$receipt_code" = "401" -o "$receipt_code" = "403"
      - name: Validate effective API and web Docker runtime sandbox
        run: |
          bash scripts/verify-container-sandbox.sh api
          bash scripts/verify-container-sandbox.sh web
      - name: Refuse unapproved restore rehearsal
        run: |
          if bash infra/verification/restore-rehearsal.sh; then
            echo "Unsafe restore invocation unexpectedly accepted" >&2
            exit 1
          fi
      - name: Seed isolated synthetic staff, game and audit evidence
        run: |
          docker compose exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < infra/fixtures/e2e-browser.sql
          docker compose exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < infra/fixtures/restore-rehearsal.sql
      - name: Rehearse PostgreSQL dump and verified separate-database restore
        env:
          SCS_RESTORE_TEST_ISOLATED: "yes"
        run: bash infra/verification/restore-rehearsal.sh
      - name: Diagnose services if smoke test fails
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Remove isolated CI containers and data
        if: always()
        run: docker compose down --volumes --remove-orphans

  browser-e2e:
    name: Chromium / full guest-to-cash receipt lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare isolated non-production services
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-isolated-e2e-not-production/' .env
          sed -i 's/^SCS_JOIN_THROTTLE_SECRET=.*/SCS_JOIN_THROTTLE_SECRET=only-for-browser-ci-a-unique-disposable-hmac-key/' .env
          docker compose config -q
      - name: Build and start isolated app and PostgreSQL
        run: docker compose up --build --detach
      - name: Wait for migrations and web then seed synthetic role fixtures
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/system/status > /tmp/e2e-health.json               && curl --fail --silent http://127.0.0.1:3000/staff/login > /tmp/e2e-login.html; then
              break
            fi
            sleep 3
          done
          grep -q '"database":"connected"' /tmp/e2e-health.json
          grep -q 'Masuk sebagai staf' /tmp/e2e-login.html
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1' < infra/fixtures/e2e-browser.sql
      - name: Install Chromium browser testing dependency
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Run authenticated full browser acceptance
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test --config e2e/playwright.config.mjs
      - name: Upload browser failure trace and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-e2e-failure
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Diagnose isolated services on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Destroy isolated browser test database and containers
        if: always()
        run: docker compose down --volumes --remove-orphans

  sandbox-browser-e2e:
    name: Chromium / isolated QRIS-VA fake sandbox and money invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare disposable non-merchant sandbox
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=disposable-sandbox-ci-only/' .env
          sed -i 's/^SCS_JOIN_THROTTLE_SECRET=.*/SCS_JOIN_THROTTLE_SECRET=sandbox-browser-ci-only-not-a-real-hmac-secret-2026/' .env
          docker compose -f compose.yaml -f infra/verification/compose.sandbox-e2e.yaml config -q
      - name: Build and start fake-only checkout services
        run: docker compose -f compose.yaml -f infra/verification/compose.sandbox-e2e.yaml up --build --detach
      - name: Wait for clean migration and seed synthetic browser fixtures
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/system/status > /tmp/scs-fake-sandbox-health.json &&
              curl --fail --silent http://127.0.0.1:3000/staff/login > /tmp/scs-fake-sandbox-login.html; then
              break
            fi
            sleep 3
          done
          grep -q '"database":"connected"' /tmp/scs-fake-sandbox-health.json
          grep -q 'Masuk sebagai staf' /tmp/scs-fake-sandbox-login.html
          docker compose -f compose.yaml -f infra/verification/compose.sandbox-e2e.yaml \
            exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1' \
            < infra/fixtures/e2e-browser.sql
      - name: Install disposable Chromium
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise guest QRIS and VA fake creation through browser and API
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_SANDBOX_PAYMENTS: "true"
        run: npx playwright test --config e2e/playwright.config.mjs e2e/sandbox-payments.spec.mjs
      - name: Assert PostgreSQL never records fake money or fake kitchen release
        run: |
          set -euo pipefail
          query() {
            docker compose -f compose.yaml -f infra/verification/compose.sandbox-e2e.yaml \
              exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc "$1"' sh "$1"
          }
          test "$(query "SELECT COUNT(*) FROM digital_payment_attempts WHERE provider_key='SANDBOX_FAKE' AND state='PENDING'")" = "2"
          test "$(query "SELECT COUNT(*) FROM payment_intents WHERE method_selected IN ('QRIS','VA') AND (aggregate_status<>'PENDING' OR amount_paid_idr<>0)")" = "0"
          test "$(query "SELECT COUNT(*) FROM receipts r JOIN payment_intents p ON p.order_id=r.order_id WHERE p.method_selected IN ('QRIS','VA')")" = "0"
          test "$(query "SELECT COUNT(*) FROM kitchen_tickets k JOIN payment_intents p ON p.order_id=k.order_id WHERE p.method_selected IN ('QRIS','VA')")" = "0"
      - name: Seed one quarantined, synthetic unknown reference for admin review
        run: |
          docker compose -f compose.yaml -f infra/verification/compose.sandbox-e2e.yaml \
            exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1' \
            < infra/fixtures/e2e-sandbox-reconciliation.sql
      - name: Verify ADMIN-only read-only reconciliation in sandbox Chromium
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_SANDBOX_PAYMENTS: "true"
        run: npx playwright test --config e2e/playwright.config.mjs e2e/sandbox-reconciliation.spec.mjs
      - name: Upload fake-payment browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-fake-payments-failure
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Diagnose disposable services when sandbox acceptance fails
        if: failure()
        run: docker compose -f compose.yaml -f infra/verification/compose.sandbox-e2e.yaml logs --no-color --tail=120
      - name: Destroy fake-payment CI containers and data
        if: always()
        run: docker compose -f compose.yaml -f infra/verification/compose.sandbox-e2e.yaml down --volumes --remove-orphans

  edge-https-e2e:
    name: HTTPS edge / trusted headers / Chromium acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure isolated secrets and self-signed TLS certificate
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-edge-ephemeral-only/' .env
          sed -i 's/^SCS_JOIN_THROTTLE_SECRET=.*/SCS_JOIN_THROTTLE_SECRET=edge-ci-only-disposable-hmac-secret-2026/' .env
          mkdir -p infra/edge/local-tls
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout infra/edge/local-tls/key.pem -out infra/edge/local-tls/cert.pem \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost'
          chmod 600 infra/edge/local-tls/key.pem
          docker compose -f compose.yaml -f infra/edge/compose.edge.yaml config -q
      - name: Start isolated HTTPS edge, API, web and PostgreSQL
        run: docker compose -f compose.yaml -f infra/edge/compose.edge.yaml up --build --detach
      - name: Verify TLS, Host and ingress limits with spoofed headers
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            if curl --fail --silent --insecure https://localhost:8443/staff/login > /tmp/scs-edge-login.html; then
              break
            fi
            sleep 3
          done
          grep -q 'Masuk sebagai staf' /tmp/scs-edge-login.html
          openssl s_client -connect localhost:8443 -servername localhost -tls1_2 < /dev/null 2>/dev/null |
            grep -q 'Protocol  *: TLSv1.2' || true
          hostile=$(curl --silent --insecure --output /tmp/scs-host-denied --write-out '%{http_code}' \
            -H 'Host: attacker.invalid' https://localhost:8443/)
          test "$hostile" = "421"
          # Forged per-request XFF identities cannot reset the TCP-peer limiter.
          blocked=0
          for i in $(seq 1 30); do
            code=$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' \
              -X POST -H 'Origin: https://localhost:8443' \
              -H "X-Forwarded-For: 192.0.2.$i" \
              -H 'Content-Type: application/json' --data '{}' \
              https://localhost:8443/t/e2e-01)
            if [ "$code" = 429 ]; then blocked=1; break; fi
          done
          test "$blocked" = 1
      - name: Seed synthetic staff, table and menu in disposable database
        run: |
          set -euo pipefail
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/system/status > /tmp/scs-edge-db.json; then break; fi
            sleep 3
          done
          grep -q '"database":"connected"' /tmp/scs-edge-db.json
          docker compose -f compose.yaml -f infra/edge/compose.edge.yaml exec -T db \
            sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1' < infra/fixtures/e2e-browser.sql
      - name: Install Chromium browser testing dependency
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise full cash workflow and negative CSRF via HTTPS edge
        working-directory: apps/web
        env:
          E2E_BASE_URL: https://localhost:8443
          E2E_PROXY_TLS: "true"
        run: npx playwright test --config e2e/playwright.config.mjs
      - name: Upload HTTPS edge browser traces if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-https-edge-failure
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Diagnose isolated edge on failure
        if: failure()
        run: docker compose -f compose.yaml -f infra/edge/compose.edge.yaml logs --no-color --tail=120
      - name: Destroy isolated edge, synthetic database and local TLS private key
        if: always()
        run: |
          docker compose -f compose.yaml -f infra/edge/compose.edge.yaml down --volumes --remove-orphans
          rm -rf infra/edge/local-tls

  live-cursor-load:
    name: Async live-cursor / isolated concurrency benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCS_LIVE_MAX_LONG_POLLS: "12"
      SCS_LIVE_MAX_STAFF_POLLS: "3"
      SCS_LIVE_MAX_GUEST_POLLS: "2"
      SCS_PERF_GLOBAL_LIMIT: "12"
      SCS_PERF_STAFF_LIMIT: "3"
      SCS_PERF_IDENTITIES: "12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure synthetic isolated PostgreSQL and live budgets
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=only-for-isolated-live-load-ci/' .env
          sed -i 's/^SCS_JOIN_THROTTLE_SECRET=.*/SCS_JOIN_THROTTLE_SECRET=live-load-ci-unique-disposable-hmac-secret-2026/' .env
          docker compose config -q
      - name: Build and start disposable API and database
        run: docker compose up --build --detach
      - name: Verify clean Flyway and seed fake staff accounts
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/system/status > /tmp/scs-load-ready.json; then break; fi
            sleep 3
          done
          grep -q '"database":"connected"' /tmp/scs-load-ready.json
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1' < infra/fixtures/e2e-live-load.sql
      - name: Measure concurrent async cursor admission and HTTP responsiveness
        run: |
          set -euo pipefail
          node infra/perf/live-cursor-load.mjs | tee /tmp/scs-live-load.jsonl
          {
            echo '### Isolated live-cursor load observations'
            echo ''
            echo 'Experimental local runner results, not a production capacity promise.'
            echo '```json'
            cat /tmp/scs-live-load.jsonl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnose on failure
        if: failure()
        run: docker compose logs --no-color --tail=100 api db
      - name: Destroy disposable load-test database
        if: always()
        run: docker compose down --volumes --remove-orphans

  live-replica-recovery:
    name: PostgreSQL live / two replicas / restart catch-up
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure disposable two-backend isolated environment
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=two-replica-ci-disposable-only/' .env
          sed -i 's/^SCS_JOIN_THROTTLE_SECRET=.*/SCS_JOIN_THROTTLE_SECRET=two-replica-ci-disposable-HMAC-secret/' .env
          docker compose -f compose.yaml -f infra/perf/compose.replicas.yaml config -q
      - name: Start both isolated backends on shared disposable PostgreSQL
        run: |
          docker compose -f compose.yaml -f infra/perf/compose.replicas.yaml up --build --detach db api api_replica
      - name: Check both backend database connections and insert synthetic roles
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/system/status > /tmp/scs-replica-a.json \
              && curl --fail --silent http://127.0.0.1:8081/api/v1/system/status > /tmp/scs-replica-b.json; then
              break
            fi
            sleep 3
          done
          grep -q '"database":"connected"' /tmp/scs-replica-a.json
          grep -q '"database":"connected"' /tmp/scs-replica-b.json
          docker compose -f compose.yaml -f infra/perf/compose.replicas.yaml exec -T db \
            sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1' \
            < infra/fixtures/e2e-browser.sql
      - name: Check effective nonroot sandbox on both backend replicas
        run: |
          bash scripts/verify-container-sandbox.sh api
          bash scripts/verify-container-sandbox.sh api_replica
      - name: Test two listeners and missed NOTIFY recovery after replica restart
        run: |
          set -euo pipefail
          node infra/perf/multireplica-live-recovery.mjs | tee /tmp/scs-replica-evidence.json
          {
            echo '### Two-replica live recovery (disposable CI)'
            echo ''
            echo 'Synthetic table visit and both API instances share a disposable PostgreSQL.'
            echo '```json'
            cat /tmp/scs-replica-evidence.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnose isolated services if acceptance fails
        if: failure()
        run: docker compose -f compose.yaml -f infra/perf/compose.replicas.yaml logs --no-color --tail=120 api api_replica db
      - name: Remove two backend replicas and ephemeral database
        if: always()
        run: docker compose -f compose.yaml -f infra/perf/compose.replicas.yaml down --volumes --remove-orphans
