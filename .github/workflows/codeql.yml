name: CodeQL static security analysis

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout without persisting a repository credential
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java for Maven code extraction
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Initialize CodeQL with extended security rules
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-extended
      - name: Compile Java sources under CodeQL instrumentation
        if: matrix.language == 'java-kotlin'
        working-directory: backend
        run: mvn -B -ntp -DskipTests package
      - name: Analyze and upload alerts to GitHub Code Scanning
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-diagnostic
      - name: Diagnose CodeQL rule IDs and source locations for security review
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          find codeql-diagnostic -type f -name '*.sarif' -exec jq -r             '.runs[]?.results[]? | [.ruleId, .locations[0].physicalLocation.artifactLocation.uri, .locations[0].physicalLocation.region.startLine] | @tsv' {} +
