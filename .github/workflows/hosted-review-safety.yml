name: Synthetic Aiven Review Branch Safety Checks

on:
  push:
    branches:
      - fix/m8-hosted-review-one-time-migration
    paths:
      - "backend/**"
      - "scripts/*aiven*"
      - ".github/workflows/hosted-review-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scs-review-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-owner-provision:
    name: Compile Java owner provisioner / reject unsafe bootstrap / parse PowerShell
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact commit without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Parse both owner-local PowerShell scripts (never execute against Aiven)
        shell: pwsh
        run: |
          foreach ($path in @(
            "scripts/migrate-aiven-review-windows.ps1",
            "scripts/provision-aiven-review-admin-windows.ps1"
          )) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              throw ($path + ": " + ($parseErrors | ForEach-Object Message) -join "; ")
            }
          }
      - name: Compile all Java including the opt-in JUnit runner (never execute owner runner)
        working-directory: backend
        run: mvn -B -ntp -DskipTests test
      - name: Run safe mock-only bootstrap and Flyway rejection tests
        working-directory: backend
        run: mvn -B -ntp -Dtest=HostedReviewBootstrapGuardTest,HostedMySqlReviewFlywaySafetyTest test
      - name: Prove no external database or payment credentials supplied
        run: |
          set -eu
          test ! -f .env
          test ! -f backend/.env
          test ! -f apps/web/.env
          test -z "${SCS_OWNER_AIVEN_PASSWORD:-}"
          test -z "${SCS_OWNER_ADMIN_PASSWORD:-}"
