spring:
  main:
    # Vercel Hobby must bind its port rapidly. The review preflight verifies
    # V31 and critical immutable triggers before Spring is launched.
    # PostgreSQL and all non-review starts retain eager initialization.
    lazy-initialization: ${SCS_MYSQL_REVIEW_ENABLED:false}
  application:
    name: smart-cafe-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smart_cafe}
    username: ${DB_USERNAME:smart_cafe}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # PostgreSQL remains the default. An isolated synthetic Aiven review
    # explicitly selects classpath:db/mysql; never mix migration engines.
    locations: ${SCS_FLYWAY_LOCATIONS:classpath:db/migration}
server:
  # Honour the platform-assigned listening port; local Docker remains 8080.
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

# Digital checkout is intentionally disabled in all normal deployments.
# Both environment=sandbox AND explicit sandbox-digital-checkout-enabled=true
# are required to create QRIS/VA pending orders. No real payment adapter.
scs:
  mysql:
    # Must be explicitly acknowledged for a disposable/isolated review only.
    # The pre-Flyway guard also requires scs_review_* schema, strict TLS,
    # disabled digital payments and a nonempty DB password.
    review-enabled: ${SCS_MYSQL_REVIEW_ENABLED:false}
    review-ack: ${SCS_MYSQL_REVIEW_ACK:}
  payments:
    sandbox-digital-checkout-enabled: ${SCS_PAYMENT_SANDBOX_CHECKOUT_ENABLED:false}
    environment: ${SCS_PAYMENT_ENVIRONMENT:disabled}
    # Demo signing key only; NEVER copy to production or treat as a real
    # provider token. Unset by default: callback intake returns 503.
    sandbox-webhook-secret: ${SCS_SANDBOX_WEBHOOK_SECRET:}
