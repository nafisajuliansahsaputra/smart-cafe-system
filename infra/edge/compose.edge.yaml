# Opt-in LOCAL HTTPS test overlay. No internet-facing binding.
# Run only with synthetic data and a short-lived local cert (see runbook).
services:
  edge:
    image: nginx:1.27-alpine
    restart: "no"
    depends_on:
      - web
    volumes:
      - ./infra/edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/edge/proxy-safe.conf:/etc/nginx/proxy-safe.conf:ro
      - ./infra/edge/local-tls:/etc/nginx/tls:ro
    ports:
      - "127.0.0.1:8443:443"
