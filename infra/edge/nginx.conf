# LOCAL HTTPS acceptance proxy only. NOT ready for public deployment.
# Direct TCP peer is the rate-limit key. Do not place a CDN/proxy in front of
# this config without an audited, allowlisted real_ip chain.
map $request_method $scs_post_client {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $scs_post_client zone=scs_guest_join:10m rate=2r/s;
limit_req_zone $scs_post_client zone=scs_staff_login:10m rate=2r/s;

# Unknown Host/SNI must never reach the Next.js application.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    return 421;
}

server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 128k;
    client_body_timeout 10s;
    send_timeout 30s;
    limit_req_status 429;
    server_tokens off;

    # Accepted public Host is intentionally fixed for disposable CI only.
    # Replace with a separately audited real-domain config before staging use.
    if ($host != "localhost") { return 421; }

    location = /staff/login {
        limit_req zone=scs_staff_login burst=6 nodelay;
        include /etc/nginx/proxy-safe.conf;
    }
    location ^~ /t/ {
        limit_req zone=scs_guest_join burst=6 nodelay;
        include /etc/nginx/proxy-safe.conf;
    }
    location / {
        include /etc/nginx/proxy-safe.conf;
    }
}
